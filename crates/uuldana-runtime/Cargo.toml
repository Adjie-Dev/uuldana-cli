[package]
name = "uuldana-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Provider-agnostic process supervisor and mock provider for Uuldana"

[dependencies]
uuldana-core.workspace = true
uuldana-provider-sdk.workspace = true
uuldana-transport = { path = "../uuldana-transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"

[dev-dependencies]

[target.'cfg(windows)'.dev-dependencies]
subc-jobobject = "0.2.1"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
