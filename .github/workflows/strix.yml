name: Strix security scan
# Whitebox scan of this repository with Strix (https://github.com/tghastings/strix-claude-code,
# the Claude Code port of Strix). Run by hand only: it spends paid API quota and
# needs Docker for its sandbox, which ubuntu runners have.
#
# Never add `pull_request` or `pull_request_target` here. The job holds an API
# key; a pull request from a fork must never be able to run next to it.
#
# One-time setup: Settings, Environments, New environment `strix`, turn on
# "Required reviewers", and add these two secrets to that environment (not to
# the repository, so no other workflow can read them):
#   ANTHROPIC_API_KEY       a key made only for this, with a low spend limit
#   STRIX_REPORT_PASSPHRASE any long random text; it encrypts the report
#
# The repository is public and anyone signed in to GitHub can download its
# artifacts, so the report (which describes unfixed weaknesses) is uploaded
# encrypted. Decrypt it on your machine:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in strix-report.md.enc -out strix-report.md
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan depth'
        type: choice
        options: [quick, standard, deep]
        default: quick
      focus:
        description: 'Optional focus, for example: auth and path handling'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: strix
  cancel-in-progress: false

jobs:
  strix:
    name: Strix whitebox scan
    if: github.repository == 'Adjie-Dev/uuldana-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: strix
    env:
      CLAUDE_CODE_VERSION: '2.1.319'
      STRIX_CLAUDE_COMMIT: '55d7a39768ce7c4ff2e1e140114246cfbcaf9ff2'
      STRIX_SANDBOX_IMAGE: 'ghcr.io/usestrix/strix-sandbox:1.3.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stop early when a secret is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIX_REPORT_PASSPHRASE: ${{ secrets.STRIX_REPORT_PASSPHRASE }}
        run: |
          missing=0
          for name in ANTHROPIC_API_KEY STRIX_REPORT_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set in the strix environment"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Install Strix at a fixed commit
        run: |
          python3 -m venv "$RUNNER_TEMP/strix-venv"
          "$RUNNER_TEMP/strix-venv/bin/pip" install --quiet \
            "git+https://github.com/tghastings/strix-claude-code@${STRIX_CLAUDE_COMMIT}"

      - name: Pull the sandbox image
        run: docker pull "$STRIX_SANDBOX_IMAGE"

      - name: Scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ inputs.mode }}
          FOCUS: ${{ inputs.focus }}
        run: |
          report_dir="$RUNNER_TEMP/report"
          mkdir -p "$report_dir"
          extra=""
          if [ -n "$FOCUS" ]; then
            printf '%s' "$FOCUS" > "$RUNNER_TEMP/focus.txt"
            extra="--instruction-file $RUNNER_TEMP/focus.txt"
          fi
          # The Claude CLI wants a terminal and falls back to printing
          # instructions without one, so give it a pseudo terminal.
          script -qec "$RUNNER_TEMP/strix-venv/bin/strix-claude-cli -t $GITHUB_WORKSPACE -m $MODE -o $report_dir/strix-report.md -v $extra" /dev/null
          test -s "$report_dir/strix-report.md" || { echo "::error::Strix wrote no report"; exit 1; }

      - name: Summarise without details
        if: always()
        run: |
          report="$RUNNER_TEMP/report/strix-report.md"
          if [ -s "$report" ]; then
            {
              echo "### Strix finished"
              echo
              echo "The report is attached encrypted. Findings are not printed here because this repository is public."
              echo
              for level in Critical High Medium Low; do
                echo "- $level: $(grep -ciE "severity[^a-z]*$level" "$report" || true)"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Encrypt the report
        if: always()
        env:
          STRIX_REPORT_PASSPHRASE: ${{ secrets.STRIX_REPORT_PASSPHRASE }}
        run: |
          report="$RUNNER_TEMP/report/strix-report.md"
          [ -s "$report" ] || exit 0
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STRIX_REPORT_PASSPHRASE \
            -in "$report" -out "$RUNNER_TEMP/report/strix-report.md.enc"
          rm -f "$report"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: strix-report-encrypted
          path: ${{ runner.temp }}/report/strix-report.md.enc
          if-no-files-found: ignore
          retention-days: 14
