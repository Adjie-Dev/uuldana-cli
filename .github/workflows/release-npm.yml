name: Publish to npm
# Publishes the Windows x64 package `uuldana-cli` to npm when a tag `vX.Y.Z` is
# pushed. Login is npm Trusted Publishing (OpenID Connect): no token is stored.
# One-time setup on npmjs.com is described in docs/RELEASING.md.
#
# A manual run is a dry run by default: it builds and packs everything and runs
# `npm publish --dry-run`, and publishes nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only; do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish (windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
              Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw 'could not read the version from Cargo.toml' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
              throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Stop if this version is already on npm
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $found = npm view "uuldana-cli@$env:VERSION" version 2>$null
          if ($found) { throw "uuldana-cli@$env:VERSION is already published; raise the version" }
          $global:LASTEXITCODE = 0

      - name: Install toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable-x86_64-pc-windows-msvc

      - name: Build Windows test process helper
        shell: pwsh
        run: |
          ./scripts/prepare-test-helper.ps1
          "UULDANA_TEST_PROCINFO=$env:UULDANA_TEST_PROCINFO" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

      - name: Build the release binary
        shell: pwsh
        run: |
          . ./scripts/release-env.ps1
          cargo build --release -p uuldana-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack the npm package
        shell: pwsh
        run: ./packaging/npm/build.ps1

      - name: Smoke test the packed package in a clean folder
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tgz = (Get-ChildItem target/npm -Filter *.tgz | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'npm-smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location $dir
          npm init -y | Out-Null
          npm install $tgz --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install of the packed package failed' }
          $out = & (Join-Path $dir 'node_modules/.bin/uuldana.cmd') --version
          Pop-Location
          Write-Host $out
          if ($out -notmatch [regex]::Escape("uuldana $env:VERSION ")) {
              throw "unexpected version output: $out"
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # npm answers a refused trusted publish with a bare 404. This asks the same
      # question first and prints npm's own reason (for example, that no trusted
      # publisher matches this repository and workflow). It prints no token, and
      # it never blocks the release: the Publish step decides.
      - name: Ask npm whether it trusts this workflow
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $request = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=npm:registry.npmjs.org"
          $identity = (Invoke-RestMethod -Uri $request -Headers @{ Authorization = "Bearer $($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" }).value
          try {
              Invoke-RestMethod -Method Post -Uri 'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/uuldana-cli' -Headers @{ Authorization = "Bearer $identity" } | Out-Null
              Write-Host 'npm accepted the identity of this workflow.'
          } catch {
              Write-Host "npm refused the identity of this workflow: $($_.ErrorDetails.Message)"
              throw
          }

      - name: Publish
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $tgz = (Get-ChildItem target/npm -Filter *.tgz | Select-Object -First 1).FullName
          $dry = ($env:EVENT_NAME -eq 'workflow_dispatch') -and ($env:DRY_RUN -ne 'false')
          if ($dry) {
              npm publish $tgz --access public --dry-run
          } else {
              npm publish $tgz --access public
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uuldana-cli-npm-package
          path: target/npm/*.tgz
          if-no-files-found: error
