name: Publish to npm
# Publishes the Windows x64 package `uuldana-cli` to npm. Every push to main
# runs the first job, which reads the version in Cargo.toml and asks npm whether
# that version is already published. If it is, nothing else happens. If it is
# not, the second job builds, tests, packs and publishes it. So a release is: raise
# the version, push. Pushing without raising the version publishes nothing,
# because npm refuses a version that was published before.
#
# Login is npm Trusted Publishing (OpenID Connect): no token is stored. The
# one-time setup on npmjs.com is described in docs/RELEASING.md.
#
# A manual run is a dry run by default: it builds and packs everything and runs
# `npm publish --dry-run`, and publishes nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack only; do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  check:
    name: Is this version already on npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read the version and ask npm
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "(.+)"/\1/')
          if [ -z "$version" ]; then
            echo "could not read the version from Cargo.toml"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            publish=true
          elif npm view "uuldana-cli@${version}" version > /dev/null 2>&1; then
            publish=false
          else
            publish=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ]; then
            echo "uuldana-cli@${version} is not on npm yet: building and publishing it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "uuldana-cli@${version} is already on npm: nothing to publish. Raise the version in Cargo.toml to release." >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    name: Build and publish (windows x64)
    needs: check
    if: ${{ needs.check.outputs.publish == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable-x86_64-pc-windows-msvc

      - name: Build Windows test process helper
        shell: pwsh
        run: |
          ./scripts/prepare-test-helper.ps1
          "UULDANA_TEST_PROCINFO=$env:UULDANA_TEST_PROCINFO" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

      - name: Build the release binary
        shell: pwsh
        run: |
          . ./scripts/release-env.ps1
          cargo build --release -p uuldana-cli --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack the npm package
        shell: pwsh
        run: ./packaging/npm/build.ps1

      - name: Smoke test the packed package in a clean folder
        shell: pwsh
        run: |
          $tgz = (Get-ChildItem target/npm -Filter *.tgz | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'npm-smoke'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Push-Location $dir
          npm init -y | Out-Null
          npm install $tgz --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm install of the packed package failed' }
          $out = & (Join-Path $dir 'node_modules/.bin/uuldana.cmd') --version
          Pop-Location
          Write-Host $out
          if ($out -notmatch [regex]::Escape("uuldana $env:VERSION ")) {
              throw "unexpected version output: $out"
          }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # npm answers a refused trusted publish with a bare 404. This asks the same
      # question first and prints npm's own reason (for example, that no trusted
      # publisher matches this repository and workflow). It prints no token, and
      # it never blocks the release: the Publish step decides.
      - name: Ask npm whether it trusts this workflow
        if: ${{ github.event_name == 'push' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $request = "$($env:ACTIONS_ID_TOKEN_REQUEST_URL)&audience=npm:registry.npmjs.org"
          $identity = (Invoke-RestMethod -Uri $request -Headers @{ Authorization = "Bearer $($env:ACTIONS_ID_TOKEN_REQUEST_TOKEN)" }).value
          try {
              Invoke-RestMethod -Method Post -Uri 'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/uuldana-cli' -Headers @{ Authorization = "Bearer $identity" } | Out-Null
              Write-Host 'npm accepted the identity of this workflow.'
          } catch {
              Write-Host "npm refused the identity of this workflow: $($_.ErrorDetails.Message)"
              throw
          }

      - name: Publish
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $tgz = (Get-ChildItem target/npm -Filter *.tgz | Select-Object -First 1).FullName
          $dry = ($env:EVENT_NAME -eq 'workflow_dispatch') -and ($env:DRY_RUN -ne 'false')
          if ($dry) {
              npm publish $tgz --access public --dry-run
          } else {
              npm publish $tgz --access public
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uuldana-cli-npm-package
          path: target/npm/*.tgz
          if-no-files-found: error
