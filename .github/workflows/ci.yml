name: Rust CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable-x86_64-unknown-linux-gnu
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install explicit host toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Select stable toolchain
        run: rustup default ${{ matrix.toolchain }}
      - name: Report toolchain
        run: rustc -vV
      - name: Install native Windows GNU prerequisites
        if: matrix.toolchain == 'stable-x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          ./scripts/install-windows-gnu.ps1
          (Join-Path $env:LOCALAPPDATA 'uuldana/toolchains/msys2-mingw64-20261012/mingw64/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows test process helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/prepare-test-helper.ps1
          "UULDANA_TEST_PROCINFO=$env:UULDANA_TEST_PROCINFO" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Test all targets including keyboard encoding
        timeout-minutes: 8
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --locked --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/test-all.log"
      - name: Name the failing tests
        if: failure()
        shell: bash
        run: |
          # The raw log needs a login to read; annotations are public.
          for log in "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/test-all.log"; do
            [ -f "$log" ] || continue
            {
              # Why the first failing tests failed: their captured output.
              awk '/^---- .* stdout ----$/{n++; p=(n<=3)} p{print} /^$/{p=0}' "$log" | head -n 20
              grep -E '\.\.\. FAILED|has been running for over' "$log" | sed 's/^test //' | sort -u
            } | fold -w 110 | head -n 10 | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::$line"
            done
          done
      - name: Check
        run: cargo check --workspace --locked
      - name: Build subprocess test fixture
        run: cargo build -p uuldana-transport --example uuldana-test-child --locked
      - name: Scripted PTY feasibility probe
        run: cargo run -p uuldana-transport --example pty_probe --locked -- --scripted
      - name: Native Windows backend suspension regression
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/portable-pty
        run: cargo test --manifest-path vendor/portable-pty/Cargo.toml --lib --locked
      - name: Repeated stress tests with external process watchdogs
        shell: bash
        run: |
          set -o pipefail
          python scripts/stress.py --parallel-runs 4 --sequential-runs 3 --deadline 60 2>&1 | tee "$RUNNER_TEMP/stress.log"
      - name: Name the failing stress run
        if: failure()
        shell: bash
        run: |
          # The raw log needs a login to read; annotations are public.
          python - <<'EOF'
          import glob, json, os, re
          runs = sorted(glob.glob('target/verification/stress/*/results.jsonl'), key=os.path.getmtime)
          out = []
          if runs:
              for raw in open(runs[-1]):
                  r = json.loads(raw)
                  if r['passed']:
                      continue
                  out.append(f"FAIL {r['stage']} {r['target']} run {r['run']} code={r['exit_code']} timeout={r['timed_out']} {r['seconds']}s")
                  for suffix in ('.stdout.log', '.stderr.log'):
                      try:
                          lines = open(r['log'] + suffix, errors='replace').read().splitlines()
                      except OSError:
                          continue
                      for i, line in enumerate(lines):
                          if re.search(r'\.\.\. FAILED|panicked at|has been running for over|^error|watchdog', line):
                              out.append(line.strip())
                              if 'panicked at' in line and i + 1 < len(lines):
                                  out.append(lines[i + 1].strip())
                  break
          chunks = [text[i:i + 100] for text in out for i in range(0, max(len(text), 1), 100)]
          for chunk in chunks[:10]:
              print('::error::' + chunk.replace('%', '%25'))
          EOF
      - name: Native Windows Job completion observer
        if: runner.os == 'Windows'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/native-jobobject
        run: |
          cargo fmt --manifest-path vendor/subc-jobobject/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path vendor/subc-jobobject/Cargo.toml --lib --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path vendor/subc-jobobject/Cargo.toml --lib --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify watchdog cleanup across Unix process groups
        if: runner.os != 'Windows'
        run: python -m unittest discover -s scripts/tests -v

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check Cargo.lock against the RustSec database
        run: cargo audit
